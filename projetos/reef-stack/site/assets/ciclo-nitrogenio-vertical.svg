<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 520" width="320" height="520" role="img" aria-labelledby="cnv-t cnv-d"><title id="cnv-t">Ciclo do nitrogênio no aquário</title><desc id="cnv-d">Restos de comida e excrementos viram amônia, que é tóxica. Bactérias transformam a amônia em nitrito, também tóxico, e depois em nitrato, bem menos tóxico. O nitrato se acumula e é reduzido pelas trocas parciais de água e pelas plantas.</desc><defs><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0A6E78"/></marker></defs><g font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#0B2A3F"><rect x="56" y="16" width="208" height="64" rx="12" fill="#FFFFFF" stroke="#5A7383" stroke-width="2.5"/><text x="160.0" y="44.0" text-anchor="middle">Restos de comida</text><text x="160.0" y="63.0" text-anchor="middle">e excrementos</text><rect x="56" y="120" width="208" height="64" rx="12" fill="#FFFFFF" stroke="#B8432A" stroke-width="2.5"/><text x="160.0" y="148.0" text-anchor="middle" font-weight="700" font-size="17">Amônia</text><text x="160.0" y="167.0" text-anchor="middle">(tóxica)</text><rect x="56" y="224" width="208" height="64" rx="12" fill="#FFFFFF" stroke="#B8432A" stroke-width="2.5"/><text x="160.0" y="252.0" text-anchor="middle" font-weight="700" font-size="17">Nitrito</text><text x="160.0" y="271.0" text-anchor="middle">(tóxico)</text><rect x="56" y="328" width="208" height="64" rx="12" fill="#FFFFFF" stroke="#1F6B4A" stroke-width="2.5"/><text x="160.0" y="356.0" text-anchor="middle" font-weight="700" font-size="17">Nitrato</text><text x="160.0" y="375.0" text-anchor="middle">(menos tóxico)</text><rect x="16" y="432" width="288" height="64" rx="12" fill="#E5F1F7" stroke="#0A6E78" stroke-width="2.5"/><text x="160.0" y="460.0" text-anchor="middle">Trocas parciais de água</text><text x="160.0" y="479.0" text-anchor="middle">e plantas reduzem o nitrato</text><path d="M160 85L160 115" stroke="#0A6E78" stroke-width="2.5" marker-end="url(#p)"/><path d="M160 189L160 219" stroke="#0A6E78" stroke-width="2.5" marker-end="url(#p)"/><text x="172" y="209.0" text-anchor="start" font-size="14" font-weight="600" fill="#0A6E78">bactérias</text><path d="M160 293L160 323" stroke="#0A6E78" stroke-width="2.5" marker-end="url(#p)"/><text x="172" y="313.0" text-anchor="start" font-size="14" font-weight="600" fill="#0A6E78">bactérias</text><path d="M160 397L160 427" stroke="#0A6E78" stroke-width="2.5" marker-end="url(#p)"/></g></svg>
