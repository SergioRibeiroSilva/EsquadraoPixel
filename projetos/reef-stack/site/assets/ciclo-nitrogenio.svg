<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-labelledby="cn-t cn-d"><title id="cn-t">Ciclo do nitrogênio no aquário</title><desc id="cn-d">Restos de comida e excrementos viram amônia, que é tóxica. Bactérias transformam a amônia em nitrito, também tóxico, e depois em nitrato, bem menos tóxico. O nitrato se acumula e é reduzido pelas trocas parciais de água e pelas plantas.</desc><defs><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0A6E78"/></marker></defs><g font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#0B2A3F"><rect x="2" y="20" width="106" height="96" rx="12" fill="#FFFFFF" stroke="#5A7383" stroke-width="2.5"/><text x="55.0" y="54.5" text-anchor="middle">Restos de</text><text x="55.0" y="73.5" text-anchor="middle">comida e</text><text x="55.0" y="92.5" text-anchor="middle">excrementos</text><rect x="179" y="20" width="106" height="96" rx="12" fill="#FFFFFF" stroke="#B8432A" stroke-width="2.5"/><text x="232.0" y="64.0" text-anchor="middle" font-weight="700" font-size="17">Amônia</text><text x="232.0" y="83.0" text-anchor="middle">(tóxica)</text><rect x="356" y="20" width="106" height="96" rx="12" fill="#FFFFFF" stroke="#B8432A" stroke-width="2.5"/><text x="409.0" y="64.0" text-anchor="middle" font-weight="700" font-size="17">Nitrito</text><text x="409.0" y="83.0" text-anchor="middle">(tóxico)</text><rect x="533" y="20" width="106" height="96" rx="12" fill="#FFFFFF" stroke="#1F6B4A" stroke-width="2.5"/><text x="586.0" y="64.0" text-anchor="middle" font-weight="700" font-size="17">Nitrato</text><text x="586.0" y="83.0" text-anchor="middle">(menos tóxico)</text><path d="M114 68.0L173 68.0" stroke="#0A6E78" stroke-width="2.5" marker-end="url(#p)"/><path d="M291 68.0L350 68.0" stroke="#0A6E78" stroke-width="2.5" marker-end="url(#p)"/><path d="M468 68.0L527 68.0" stroke="#0A6E78" stroke-width="2.5" marker-end="url(#p)"/><text x="320.5" y="92.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0A6E78">bactérias</text><text x="497.5" y="92.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0A6E78">bactérias</text><rect x="356" y="168" width="282" height="72" rx="12" fill="#E5F1F7" stroke="#0A6E78" stroke-width="2.5"/><text x="497.0" y="200.0" text-anchor="middle">Trocas parciais de água</text><text x="497.0" y="219.0" text-anchor="middle">e plantas reduzem o nitrato</text><path d="M586.0 122L586.0 162" stroke="#0A6E78" stroke-width="2.5" marker-end="url(#p)"/><g font-size="14" fill="#2E4656"><rect x="4" y="180" width="18" height="18" rx="5" fill="#FFFFFF" stroke="#B8432A" stroke-width="2.5"/><text x="32" y="194">tóxico para os peixes</text><rect x="4" y="212" width="18" height="18" rx="5" fill="#FFFFFF" stroke="#1F6B4A" stroke-width="2.5"/><text x="32" y="226">menos tóxico, mas se acumula</text></g></g></svg>
