name: Publicar vitrine no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "projetos/*/site/**"
      - "vitrine/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar o Pages
        uses: actions/configure-pages@v5

      - name: Montar a vitrine e copiar os sites
        run: python3 vitrine/montar.py

      - name: Empacotar a pasta de publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: _publicar

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
