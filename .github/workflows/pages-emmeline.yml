name: Publicar Emmeline no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "projetos/emmeline-croche/site/**"
      - ".github/workflows/pages-emmeline.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar o Pages
        uses: actions/configure-pages@v5

      - name: Empacotar a pasta do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: projetos/emmeline-croche/site

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
